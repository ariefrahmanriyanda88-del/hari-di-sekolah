<!DOCTYPE html>
<html lang="id">
<head>
<script>(function(){var V="1795860018";try{var u=new URL(location.href);if(u.searchParams.get("v")===V)return;fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){if(j.v&&j.v!==V&&u.searchParams.get("v")!==j.v){u.searchParams.set("v",j.v);location.replace(u.toString())}}).catch(function(){})}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5b4a">
<title>Panel Guru · Hari di Sekolah</title>
<style>
:root{--ink:#17322b;--mut:#5f7a72;--bg:#f2f5f1;--card:#fff;--line:#dfe7e2;--pri:#0f5b4a;--pri2:#e3f1ec;--gold:#c99a2e;--bad:#b3402d;--r:14px}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
.ar,textarea,input{unicode-bidi:plaintext}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical}
label{display:block;margin:0 0 12px;font-size:13px;font-weight:600;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.main{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.small{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--bad)}.btn.wa{background:#e6f7ec;border-color:#bfe8cc;color:#15703c}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--pri);margin-top:10px;cursor:pointer;font-weight:600}
.muted{color:var(--mut)}.small{font-size:12.5px}.pad{padding:24px 4px}.err{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.auth{max-width:440px;margin:0 auto;padding:28px 16px 40px}
.brand{text-align:center;margin:8px 0 18px}.brand h1{margin:6px 0 2px;font-size:26px;letter-spacing:-.01em}.brand p{margin:0;color:var(--mut)}
.logo{width:64px;height:64px;margin:0 auto;border-radius:20px;background:var(--pri);display:grid;place-items:center;font-size:32px;box-shadow:0 6px 18px #0f5b4a33}
.auth form .btn.main{width:100%;margin-top:6px}.auth .card .btn{width:100%;margin-top:8px}
.seg{display:flex;background:#e4ebe7;border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.demo{background:#fff6dc;border:1px solid #f0dc9f;color:#7a5b0c;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px;text-align:center}
.sub{font-size:13px;font-weight:700;color:var(--ink);margin:14px 0 6px}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;margin:0;font-weight:500;color:var(--ink);cursor:pointer}
.chk input{display:none}.chk span{padding:6px 10px;border:1px solid var(--line);border-radius:20px;font-size:13px;background:#fff}
.chk input:checked+span{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.chk.wide{display:flex;margin:10px 0 4px}
.kg{margin:6px 0}.kg>b{display:block;font-size:12px;color:var(--mut);margin:6px 0 4px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--pri);color:#fff}
header b{display:block;font-size:16px}header span{font-size:12px;opacity:.8}
header .hb{display:flex;gap:6px}header .btn{background:#ffffff1f;border-color:#ffffff40;color:#fff}
nav{position:sticky;top:58px;z-index:4;display:flex;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:1;min-width:76px;border:0;background:none;padding:9px 4px 8px;font-size:12px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;position:relative}
nav button i{display:block;font-style:normal;font-size:18px}
nav button.on{color:var(--pri);border-color:var(--pri)}
nav em{position:absolute;top:4px;right:calc(50% - 22px);background:var(--bad);color:#fff;font-style:normal;font-size:10px;border-radius:10px;padding:0 5px}
nav em:empty{display:none}
main{max-width:760px;margin:0 auto;padding:14px 14px 100px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 8px}
.bar h2{font-size:17px;margin:0}
.item .ihead,.q .ihead{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;color:var(--mut)}
.chip{font-size:12px;padding:3px 9px;border-radius:20px;background:#eef3f0;color:var(--ink);white-space:nowrap}
.chip.ok{background:#dff3e7;color:#17663a}.chip.wait{background:#fff1d1;color:#8a6110}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.empty{text-align:center;padding:36px 16px;color:var(--mut);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.sw{position:relative;width:44px;height:26px;margin:0;flex:none}.sw input{display:none}
.sw span{position:absolute;inset:0;background:#cfd8d4;border-radius:20px;transition:.2s}.sw span:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--pri)}.sw input:checked+span:after{left:21px}
.q textarea{margin-bottom:6px}.q input{margin-top:6px}
.opt{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:4px 8px 4px 6px;background:#fff}
.opt input.qo{margin:0;border:0;padding:8px 4px;flex:1;outline:none}
.opt b{width:22px;text-align:center;color:var(--mut)}
.opt input.qk{width:22px;height:22px;margin:0;accent-color:#17663a;flex:none}
.opt.right{border-color:#5cb985;background:#effaf3}.opt.right b{color:#17663a}
.opt.right:after{content:"✓ benar";font-size:12px;color:#17663a;white-space:nowrap}
.qbtns{margin-left:auto;display:flex;gap:4px}.qbtns button{width:32px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:#fffffff0;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6}
.savebar .btn{width:100%;max-width:520px}
.filt{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.filt .btn{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}
.stats b{display:block;font-size:22px;color:var(--ink)}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:#f6f9f7;font-size:12px;color:var(--mut);position:sticky;top:0}
td.nm{text-align:left;font-weight:600;position:sticky;left:0;background:#fff}
td.g{color:#17663a;background:#effaf3}td.y{color:#8a6110;background:#fff8e6}td.r{color:var(--bad);background:#fdf0ed}
.url{font-family:ui-monospace,monospace;font-size:13px;background:#f6f9f7;padding:8px 10px;border-radius:8px;word-break:break-all;margin-bottom:8px}
.kodes{display:grid;grid-template-columns:1fr;gap:0}
.kd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 14px}
.kd .acts{margin:0}.kd span{display:block;font-size:12.5px}
.kode{font-family:ui-monospace,monospace;font-size:20px;letter-spacing:.14em;color:var(--pri)}
.sheet{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:10px}
.sheet .card{width:100%;max-width:560px;max-height:88vh;overflow:auto;margin:0}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:#17322b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--bad)}
@media(min-width:640px){.kodes{grid-template-columns:1fr 1fr;gap:0 12px}.filt{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"><p class="muted pad" style="text-align:center">Memuat Panel Guru…</p></div>
<div id="toast"></div>
<script src="config.js?v=1795860018"></script>
<script src="guru.js?v=1795860018"></script>
</body>
</html>
